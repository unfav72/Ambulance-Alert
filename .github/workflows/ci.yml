name: Emergency Operations CI Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

jobs:
  backend-test-and-build:
    name: Backend Lint, Test, & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ambulance_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Run Test Suite (Concurrency, Authorization, GPS, Hospital)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ambulance_test_db?schema=public
          JWT_SECRET: ci-test-secret-key-at-least-32-chars-long-secure
        run: npm test

      - name: Compile Backend TypeScript
        working-directory: ./backend
        run: npm run build

  frontend-build:
    name: Frontend PWA Build & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Distribution & Service Worker
        working-directory: ./frontend
        run: npm run build
